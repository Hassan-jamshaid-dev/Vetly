# Typecheck-only CI. There is no `npm run build` in this Expo app.
# ESLint is not configured (`expo lint` would prompt or fail), so lint is omitted.
# `npm audit` is non-blocking: React Native trees often report high issues
# that are not actionable for this client app.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Audit (non-blocking)
        run: npm audit --audit-level=high
        continue-on-error: true
